<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mala">
<title>Mala Nômade</title>
<style>
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --text: #000000; --muted: rgba(60,60,67,.6);
    --sep: rgba(60,60,67,.29); --fill: rgba(120,120,128,.12); --blue: #007AFF; --red: #FF3B30;
    --c-blue: #007AFF; --c-purple: #AF52DE; --c-orange: #FF9500; --c-green: #34C759; --c-pink: #FF2D55;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; --muted: rgba(235,235,245,.6);
      --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --blue: #0A84FF; --red: #FF453A;
      --c-blue: #0A84FF; --c-purple: #BF5AF2; --c-orange: #FF9F0A; --c-green: #30D158; --c-pink: #FF375F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; --muted: rgba(235,235,245,.6);
    --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --blue: #0A84FF; --red: #FF453A;
    --c-blue: #0A84FF; --c-purple: #BF5AF2; --c-orange: #FF9F0A; --c-green: #30D158; --c-pink: #FF375F;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  main { padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px)
                  calc(env(safe-area-inset-bottom) + 48px) calc(env(safe-area-inset-left) + 16px); }
  @media (min-width: 900px) { main { padding-left: 32px; padding-right: 32px; } }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: .37px; margin: 0; line-height: 41px; }
  .progress { font-size: 15px; color: var(--muted); }
  .bar { height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; margin: 8px 0 16px; }
  .bar > div { height: 100%; background: var(--blue); width: 0; transition: width .25s ease; border-radius: 2px; }

  .actions { display: flex; gap: 20px; margin: 0 4px 16px; }
  .actions button { border: 0; background: none; color: var(--blue); font: inherit; font-size: 15px; padding: 0; min-height: 32px; cursor: pointer; }
  .actions button:active { opacity: .5; }
  .actions button.quiet { color: var(--muted); }

  #groups { display: flex; gap: 20px; align-items: flex-start; }
  #groups .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  section { --tint: var(--blue); }
  section h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; padding: 0 4px; display: flex; align-items: center; gap: 10px; }
  section h2 .icon { width: 30px; height: 30px; border-radius: 8px; background: var(--tint); color: #fff; display: grid; place-items: center; font-size: 16px; flex: none; }
  section h2 .title { flex: 1; }
  section h2 .count { font-size: 13px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  section h2 .all { border: 0; background: none; padding: 0 4px; cursor: pointer; display: flex; align-items: center; min-height: 32px; }
  .group { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: var(--card); }
  li + li { box-shadow: inset 0 1px 0 var(--sep); }
  li input[type=checkbox] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .check { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; transition: background .15s, border-color .15s, transform .1s; }
  .check::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); opacity: 0; }
  .done .check { background: var(--tint); border-color: var(--tint); }
  .done .check::after { opacity: 1; }
  li label { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 0; cursor: pointer; user-select: none; min-width: 0; }
  li label:active .check { transform: scale(.92); }
  .name { overflow-wrap: anywhere; }
  li.done .name { color: var(--muted); }
  .qty { color: var(--tint); font-weight: 600; font-variant-numeric: tabular-nums; }
  li.done .qty { color: var(--muted); }
  .tools { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 2px; padding-left: 24px;
    background: linear-gradient(90deg, transparent, var(--card) 24px); opacity: 0; pointer-events: none; transition: opacity .15s; }
  li:hover .tools, li:focus-within .tools { opacity: 1; pointer-events: auto; }
  @media (hover: none) { .tools { position: static; transform: none; opacity: 1; pointer-events: auto; padding-left: 0; background: none; } }
  .stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 8px; height: 30px; }
  .stepper button { width: 32px; height: 30px; border: 0; background: none; color: var(--blue); font: inherit; font-size: 19px; line-height: 1; cursor: pointer; }
  .stepper button:disabled { color: var(--muted); opacity: .4; }
  .stepper output { min-width: 26px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .remove { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; width: 32px; min-height: 44px; }
  .remove:hover { color: var(--red); }
  footer.add { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--sep); }
  footer.add .plus { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--fill); color: var(--tint); display: grid; place-items: center; font-size: 18px; line-height: 1; }
  footer.add input { flex: 1; min-height: 44px; border: 0; background: transparent; color: var(--text); font: inherit; min-width: 0; }
  footer.add input:focus { outline: none; }
  footer.add input::placeholder { color: var(--muted); }
  footer.add button { border: 0; background: none; color: var(--tint); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 44px; padding: 0 4px; }
  footer.add button:disabled { opacity: 0; pointer-events: none; }
  .empty { padding: 12px 16px; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mala Nômade</h1>
    <div class="progress" id="progress">0 de 0</div>
  </header>
  <div class="bar"><div id="bar"></div></div>

  <div class="actions">
    <button id="check-all">Marcar tudo</button>
    <button id="uncheck-all">Desmarcar tudo</button>
    <button id="restore" class="quiet" hidden>Restaurar removidos</button>
  </div>

  <div id="groups"></div>
</main>

<script>
// ---------- dados: [nome, quantidade padrão] ----------
const GROUPS = [
  { id: 'documentos', title: 'Documentos', icon: '🪪', tint: 'var(--c-blue)', items: [
    ['passaporte'], ['RG ou CNH'], ['cartão de crédito'], ['cartão de débito'], ['cartão internacional habilitado'],
    ['seguro viagem'], ['comprovante de vacina internacional'], ['carteira'], ['dinheiro em espécie'],
  ]},
  { id: 'roupas', title: 'Roupas', icon: '👕', tint: 'var(--c-purple)', items: [
    ['cueca', 7], ['meia', 7], ['camisa', 5], ['calça', 2], ['bermuda', 2], ['sunga', 1],
    ['blusa de frio', 2], ['calça para frio', 1], ['boné', 1], ['chinelo', 1], ['tênis apropriado (academia, passear)', 1],
  ]},
  { id: 'eletronicos', title: 'Eletrônicos', icon: '🔌', tint: 'var(--c-orange)', items: [
    ['notebook'], ['carregador do notebook'], ['celular'], ['carregador do celular'], ['relógio'], ['carregador do relógio'],
    ['power bank carregado'], ['fones de ouvido carregados'], ['Kindle carregado'], ['adaptador global + GaN'],
  ]},
  { id: 'higiene', title: 'Higiene e saúde', icon: '🧴', tint: 'var(--c-green)', items: [
    ['escova de dente'], ['pasta de dente'], ['fio dental'], ['desodorante'], ['shampoo e condicionador'], ['perfume'],
    ['produtos de beleza'], ['remédios'], ['suplementos vitamínicos'], ['cotonete'], ['cortador de unha'],
    ['protetor solar'], ['lenço umedecido'], ['kit de primeiros socorros'],
  ]},
  { id: 'diversos', title: 'Diversos', icon: '🎒', tint: 'var(--c-pink)', items: [
    ['óculos'], ['garrafa de água'], ['caderno de anotações'], ['caneta'],
    ['apps offline (mapa, tradutor, reservas)'], ['internet no lugar de destino'],
  ]},
];

// ---------- plural PT-BR ----------
const PLURAL_EXC = { 'boné': 'bonés', 'cachecol': 'cachecóis', 'short': 'shorts',
  'tênis apropriado (academia, passear)': 'tênis apropriados (academia, passear)', 'roupa de academia': 'roupas de academia',
  'RG ou CNH': 'RG ou CNH', 'apps offline (mapa, tradutor, reservas)': 'apps offline (mapa, tradutor, reservas)', 'óculos': 'óculos',
  'shampoo e condicionador': 'shampoos e condicionadores', 'produtos de beleza': 'produtos de beleza', 'remédios': 'remédios',
  'suplementos vitamínicos': 'suplementos vitamínicos', 'fones de ouvido carregados': 'fones de ouvido carregados',
  'dinheiro em espécie': 'dinheiro em espécie', 'adaptador global + GaN': 'adaptadores globais + GaN',
  'internet no lugar de destino': 'internet no lugar de destino' };
function pluralWord(w) {
  if (/ão$/.test(w)) return w.replace(/ão$/, 'ões');
  if (/[rz]$/.test(w)) return w + 'es';
  if (/s$/.test(w)) return w;
  if (/m$/.test(w)) return w.slice(0, -1) + 'ns';
  if (/al$/.test(w)) return w.slice(0, -2) + 'ais';
  if (/el$/.test(w)) return w.slice(0, -2) + 'éis';
  if (/ol$/.test(w)) return w.slice(0, -2) + 'óis';
  if (/il$/.test(w)) return w.slice(0, -2) + 'is';
  return w + 's';
}
function plural(name) {
  if (PLURAL_EXC[name]) return PLURAL_EXC[name];
  const m = /^(.*?)(\s(?:de|da|do|para|pra|com|ou|em|no|na)\s.*|\s\(.*)$/.exec(name);
  const head = m ? m[1] : name, tail = m ? m[2] : '';
  return head.split(' ').map(pluralWord).join(' ') + tail;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------- estado ----------
const KEY = 'checklist-mala:v3';
const defaultState = () => ({ checked: {}, removed: {}, custom: {}, qty: {} });
let state = defaultState();
try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved) state = { ...defaultState(), ...saved }; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function itemsOf(group) {
  const base = group.items.map(([name, qty]) => ({ id: group.id + ':' + name, name, defaultQty: qty || 1 }));
  const custom = (state.custom[group.id] || []).map(c => ({ id: group.id + ':' + c.name, name: c.name, defaultQty: 1, custom: true }));
  return [...base, ...custom].filter(it => !state.removed[it.id]).map(it => ({ ...it, qty: state.qty[it.id] ?? it.defaultQty }));
}
function setChecked(items, val) { for (const it of items) { if (val) state.checked[it.id] = true; else delete state.checked[it.id]; } save(); render(); }

// ---------- render ----------
const groupsEl = document.getElementById('groups');
function layout() {
  const sections = [...groupsEl.querySelectorAll('section')];
  const cols = Math.max(1, Math.floor((groupsEl.clientWidth + 20) / 340));
  const columns = Array.from({ length: cols }, () => { const d = document.createElement('div'); d.className = 'col'; return d; });
  const heights = columns.map(() => 0);
  const measured = sections.map(sec => { const h = sec.offsetHeight; return { sec, h }; });
  for (const { sec, h } of measured) { const i = heights.indexOf(Math.min(...heights)); columns[i].appendChild(sec); heights[i] += h + 20; }
  groupsEl.replaceChildren(...columns);
}
window.addEventListener('resize', layout);
function render() {
  document.getElementById('restore').hidden = !Object.keys(state.removed).length;
  let total = 0, done = 0;
  groupsEl.innerHTML = '';
  for (const g of GROUPS) {
    const items = itemsOf(g);
    const doneHere = items.filter(i => state.checked[i.id]).length;
    const allDone = items.length > 0 && doneHere === items.length;
    total += items.length; done += doneHere;

    const sec = document.createElement('section');
    sec.style.setProperty('--tint', g.tint);
    sec.innerHTML = `<h2><span class="icon" aria-hidden="true">${g.icon}</span><span class="title">${g.title}</span>
      <span class="count">${doneHere} de ${items.length}</span>
      <button class="all ${allDone ? 'done' : ''}" aria-label="${allDone ? 'Desmarcar' : 'Marcar'} todo o bloco ${g.title}"><span class="check" aria-hidden="true"></span></button></h2>`;
    sec.querySelector('.all').addEventListener('click', () => setChecked(items, !allDone));

    const box = document.createElement('div'); box.className = 'group';
    const ul = document.createElement('ul');
    for (const it of items) {
      const label = it.qty > 1 ? plural(it.name) : it.name;
      const li = document.createElement('li');
      li.className = state.checked[it.id] ? 'done' : '';
      const cid = 'c-' + it.id.replace(/[^\w-]/g, '_');
      li.innerHTML = `<input type="checkbox" id="${cid}" ${state.checked[it.id] ? 'checked' : ''}>
        <label for="${cid}"><span class="check" aria-hidden="true"></span><span class="name"><span class="qty">${it.qty}</span> ${cap(label)}</span></label>
        <div class="tools">
          <div class="stepper" aria-label="Quantidade de ${it.name}">
            <button class="dec" aria-label="Menos" ${it.qty <= 1 ? 'disabled' : ''}>−</button><output>${it.qty}</output><button class="inc" aria-label="Mais">+</button>
          </div>
          <button class="remove" aria-label="Remover ${it.name}">×</button>
        </div>`;
      li.querySelector('input').addEventListener('change', e => { state.checked[it.id] = e.target.checked; save(); render(); });
      li.querySelector('.dec').addEventListener('click', () => { state.qty[it.id] = Math.max(1, it.qty - 1); save(); render(); });
      li.querySelector('.inc').addEventListener('click', () => { state.qty[it.id] = Math.min(99, it.qty + 1); save(); render(); });
      li.querySelector('.remove').addEventListener('click', () => { state.removed[it.id] = true; save(); render(); });
      ul.appendChild(li);
    }
    if (!items.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Nada aqui.'; box.appendChild(d); }
    box.appendChild(ul);

    const foot = document.createElement('footer'); foot.className = 'add';
    foot.innerHTML = `<span class="plus" aria-hidden="true">+</span><input placeholder="Adicionar item" enterkeyhint="done" autocapitalize="none"><button disabled>Adicionar</button>`;
    const inp = foot.querySelector('input');
    inp.addEventListener('input', () => { foot.querySelector('button').disabled = !inp.value.trim(); });
    const add = () => {
      const name = inp.value.trim().toLowerCase(); if (!name) return;
      state.custom[g.id] = (state.custom[g.id] || []).filter(c => c.name !== name).concat([{ name }]);
      delete state.removed[g.id + ':' + name];
      save(); render();
      groupsEl.querySelector(`[data-focus="${g.id}"]`)?.focus();
    };
    inp.dataset.focus = g.id;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    foot.querySelector('button').addEventListener('click', add);
    box.appendChild(foot);
    sec.appendChild(box);
    groupsEl.appendChild(sec);
  }
  layout();
  document.getElementById('progress').textContent = `${done} de ${total}`;
  document.getElementById('bar').style.width = total ? (100 * done / total) + '%' : '0%';
}

// ---------- eventos ----------
document.getElementById('check-all').addEventListener('click', () => setChecked(GROUPS.flatMap(itemsOf), true));
document.getElementById('uncheck-all').addEventListener('click', () => setChecked(GROUPS.flatMap(itemsOf), false));
document.getElementById('restore').addEventListener('click', () => { state.removed = {}; save(); render(); });

render();
</script>
</body>
</html>
